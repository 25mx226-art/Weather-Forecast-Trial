<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cartoon Weather Card — Reactive Sun (GSAP)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body {
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
      background: linear-gradient(to bottom, #87ceeb, #fff);
      font-family: "Poppins", sans-serif;
      overflow:hidden;
    }

    .weather-card {
      width:350px;
      height:500px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      background: linear-gradient(to bottom, #ffecd2, #fcb69f);
      position:relative;
      overflow:hidden;
      text-align:center;
    }

    .scene {
      position:relative;
      width:100%;
      height:60%;
      overflow:hidden;
    }

    /* ☀️ Sun container */
    .sun {
      width:110px;
      height:110px;
      border-radius:50%;
      background: radial-gradient(circle, #ffec85 0%, #facc15 70%);
      position:absolute;
      top:25%;
      left:50%;
      transform:translateX(-50%);
      box-shadow: 0 0 40px rgba(255,215,0,0.7);
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:3;
    }

    .face {
      position:relative;
      width:70%;
      height:50%;
    }

    .eye {
      width:14px;
      height:14px;
      background:#000;
      border-radius:50%;
      position:absolute;
      top:25%;
      transform-origin:center;
    }
    .eye.left { left:25%; }
    .eye.right { right:25%; }

    /* mouth is adjustable by JS */
    .mouth {
      width:45%;
      height:12px;
      background:#000;
      border-radius:0 0 50px 50px;
      position:absolute;
      bottom:20%;
      left:50%;
      transform:translateX(-50%);
      transform-origin:center;
    }

    /* sweat (hidden by default) */
    .sweat {
      width:10px;
      height:20px;
      background: linear-gradient(to bottom,#aef,#48c);
      border-radius:50%;
      position:absolute;
      top:12%;
      right:12%;
      opacity:0;
      transform: scale(0.5);
      z-index:4;
    }

    /* cloud base look */
    .cloud {
      position:absolute;
      background:#fff;
      border-radius:50px;
      opacity:0.95;
      z-index:2;
      filter:drop-shadow(0 0 10px rgba(255,255,255,0.35));
    }
    .cloud::before,.cloud::after {
      content:""; position:absolute; background:#fff; border-radius:50%;
    }
    .cloud::before { width:60%; height:60%; top:-30%; left:10%; }
    .cloud::after  { width:40%; height:40%; top:-20%; right:15%; }

    /* info text */
    .weather-info {
      position:absolute;
      bottom:20px; width:100%; color:#222; font-weight:600;
    }
    .temperature { font-size:2.5em; margin-bottom:8px; }
    .city { font-size:1.2em; margin-bottom:6px; }
  </style>
</head>
<body>

  <div class="weather-card summer">
    <div class="scene">
      <div class="sun" id="sun">
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth" id="mouth"></div>
        </div>
        <div class="sweat" id="sweat"></div>
      </div>

      <!-- clouds (3 examples) -->
      <div class="cloud" style="top:16%; width:130px; height:48px;"></div>
      <div class="cloud" style="top:30%; width:170px; height:62px;"></div>
      <div class="cloud" style="top:44%; width:150px; height:54px;"></div>
    </div>

    <div class="weather-info">
      <div class="temperature" id="tempValue">38°C</div>
      <div class="city">Chennai, India</div>
      <div id="conditionText">Sunny ☀️</div>
    </div>
  </div>

  <script>
    // --------------------
    // CONFIG: set temp here or replace with API value
    // --------------------
    let temperature = 50; // change this dynamically from your API
    document.getElementById('tempValue').textContent = `${temperature}°C`;

    const sun = document.getElementById('sun');
    const mouth = document.getElementById('mouth');
    const sweat = document.getElementById('sweat');
    const eyes = document.querySelectorAll('.eye');

    // BASE SUN ANIMATIONS (floating, soft scale, glow)
    gsap.to(sun, { y: "-=10", duration: 3, repeat: -1, yoyo: true, ease: "sine.inOut" });
    gsap.to(sun, { scale: 1.04, duration: 4, repeat: -1, yoyo: true, ease: "sine.inOut" });
    gsap.to(sun, { boxShadow: "0 0 60px rgba(255,215,0,1)", duration: 2, repeat: -1, yoyo: true, ease: "sine.inOut" });

    // Base joyful big-smile animation (kept as default before mood override)
    const baseSmile = gsap.to(mouth, {
      scaleX: 1.35,
      scaleY: 1.6,
      borderRadius: "0 0 80px 80px",
      duration: 1.2,
      repeat: -1,
      yoyo: true,
      ease: "elastic.inOut(1, 0.5)"
    });

    // eye blink
    eyes.forEach(eye => {
      gsap.to(eye, {
        scaleY: 0.2,
        duration: 0.12,
        repeat: -1,
        yoyo: true,
        repeatDelay: 3 + Math.random()*4,
        ease: "power1.inOut"
      });
    });

    // CLOUDS: gentle left->right continuous GSAP loop
    const clouds = document.querySelectorAll('.cloud');
    clouds.forEach((cloud, i) => {
      // horizontal travel distance relative to the card width
      const travel = 420; // px — enough to move across
      const speed = 24 + Math.random()*18; // seconds
      const staggerDelay = i * 4 + Math.random()*3;
      const startX = -250 - Math.random()*200;

      gsap.set(cloud, { x: startX }); // initial off-left
      gsap.to(cloud, {
        x: "+=" + travel,
        duration: speed,
        ease: "none",
        repeat: -1,
        repeatDelay: 1,
        delay: staggerDelay
      });

      // slow bobbing (vertical)
      gsap.to(cloud, {
        y: "+=8",
        duration: 4 + Math.random()*3,
        ease: "sine.inOut",
        repeat: -1,
        yoyo: true,
        delay: staggerDelay/2
      });
    });

    // Cursor-tracking pupils (smaller movement since pupils are separate elements)
    document.addEventListener('mousemove', e => {
      eyes.forEach(eye => {
        const rect = eye.getBoundingClientRect();
        const cx = rect.left + rect.width/2;
        const cy = rect.top + rect.height/2;
        const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
        const moveX = Math.cos(angle) * 3;
        const moveY = Math.sin(angle) * 3;
        gsap.to(eye, { x: moveX, y: moveY, duration: 0.18, ease: "sine.out" });
      });
    });

    // --------------------
    // Mood / Temperature logic (applies GSAP animations per-range)
    // --------------------
    function applyMood(temp) {
      // clear mouth/sun/sweat related tweens to avoid conflicts
      gsap.killTweensOf(mouth);
      gsap.killTweensOf(sun);
      gsap.killTweensOf(sweat);

      // keep base sun float + glow running (restart them)
      gsap.to(sun, { y: "-=10", duration: 3, repeat: -1, yoyo: true, ease: "sine.inOut" });
      gsap.to(sun, { scale: 1.04, duration: 4, repeat: -1, yoyo: true, ease: "sine.inOut" });
      gsap.to(sun, { boxShadow: "0 0 60px rgba(255,215,0,1)", duration: 2, repeat: -1, yoyo: true, ease: "sine.inOut" });

      // reset sweat hidden
      gsap.set(sweat, { opacity: 0, scale: 0.5, y: 0 });

      // Ensure mouth base visual reset first
      gsap.set(mouth, { clearProps: "all" });

      if (temp <= 25) {
        // 😎 Chill — gentle small smile
        gsap.to(mouth, { scaleX: 1.15, borderRadius: "0 0 24px 24px", height: 10, width: "42%", duration: 0.4, ease: "power1.out" });
        // subtle idle twinkle
        gsap.to(sun, { rotation: 1.5, repeat: -1, yoyo: true, duration: 3, ease: "sine.inOut" });
      }
      else if (temp <= 35) {
        // 😊 Happy — bigger smile + playful rotation
        gsap.to(mouth, { borderRadius: "0 0 60px 60px", height: 10, width: "52%", duration: 0.4, ease: "elastic.out(1,0.5)" });
        gsap.to(sun, { rotation: 3, yoyo: true, repeat: -1, duration: 2.2, ease: "sine.inOut" });
        // playful jump of mouth for extra smileiness
        gsap.fromTo(mouth, { scaleY: 1 }, { scaleY: 1.5, duration: 0.7, yoyo: true, repeat: -1, ease: "elastic.inOut(1,0.6)" });
      }
      else if (temp <= 45) {
        // 😅 Sweaty — smaller mouth, sweat appears and animates
        gsap.to(mouth, { borderRadius: "50%", height: 6, width: "35%", duration: 0.4, ease: "power1.out" });
        gsap.to(sweat, { opacity: 1, scale: 1, y: "+=18", duration: 1.4, yoyo: true, repeat: -1, ease: "sine.inOut" });
        // sun shifts color slightly (quick swap)
        gsap.to(sun, { background: "radial-gradient(circle, #ffe97f 0%, #f39c12 70%)", duration: 0.5 });
        // mild jitter to show discomfort
        gsap.to(sun, { rotation: 2, repeat: -1, yoyo: true, duration: 0.7, ease: "sine.inOut" });
      }
      else {
        // 🥵 Overheated — tiny tired mouth, redder sun, pulsing
        gsap.to(mouth, { borderRadius: "0", height: 4, width: "30%", background: "#600", duration: 0.4, ease: "power1.out" });
        gsap.to(sun, { background: "radial-gradient(circle, #ffb347 0%, #e74c3c 80%)", duration: 0.5 });
        gsap.to(sun, { scale: 1.06, repeat: -1, yoyo: true, duration: 0.8, ease: "sine.inOut" });
        // sweat intense
        gsap.to(sweat, { opacity: 1, scale: 1.1, y: "+=22", duration: 1, yoyo: true, repeat: -1, ease: "sine.inOut" });
      }
    }

    // Run the mood once with initial temperature (replace this call when data arrives)
    applyMood(temperature);

    // Example: if you later receive API temp update, call applyMood(newTemp);
    // e.g. fetch(...).then(data => applyMood(data.main.temp));
  </script>
</body>
</html>
