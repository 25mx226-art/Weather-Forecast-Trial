<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scared Storm Cloud ⛈️</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #3b5672, #0b1d2a);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
    }

    .weather-card {
      width: 360px;
      height: 520px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      background: linear-gradient(to bottom, #9daebf, #cfd8e2);
      position: relative;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 60%;
      overflow: hidden;
    }

    /* ☁️ Scared Cloud */
    .rain-cloud {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      width: 230px;
      z-index: 3;
    }

    .rain-cloud svg {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.15));
    }

    /* 👀 Face */
    .face {
      position: absolute;
      top: 38%;
      left: 0;
      right: 0;
      text-align: center;
    }

    .eye {
      width: 16px;
      height: 16px;
      background: #111;
      border-radius: 50%;
      position: absolute;
      top: 10px;
    }

    .eye.left { left: 70px; }
    .eye.right { right: 70px; }

    .mouth {
      width: 28px;
      height: 28px;
      background: #111;
      border-radius: 50%;
      margin: 42px auto 0;
      transform-origin: center;
    }

    /* 🌧️ Raindrops */
    .raindrop {
      width: 6px;
      height: 18px;
      background: linear-gradient(to bottom, #aee, #48c);
      border-radius: 50%;
      position: absolute;
      bottom: 40%;
      opacity: 0.85;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
      z-index: 2;
    }

    /* ⚡ Lightning bolts */
    .lightning {
      position: absolute;
      top: 42%;
      transform: scale(0.8);
      z-index: 4;
      opacity: 0;
      filter: drop-shadow(0 0 15px rgba(255,255,100,0.8));
    }

    .lightning.center { left: 50%; transform: translateX(-50%) scale(0.8); }
    .lightning.left { left: 25%; }
    .lightning.right { right: 25%; }

    .bolt-segment {
      position: absolute;
      background: linear-gradient(to bottom, #fff700, #ffd200);
      transform: skewX(-15deg);
    }

    .bolt-segment.top {
      width: 16px;
      height: 65px;
      left: -7px;
      top: 0;
    }

    .bolt-segment.bottom {
      width: 12px;
      height: 45px;
      left: 6px;
      top: 55px;
      transform: skewX(-15deg) rotate(10deg);
    }

    .bolt-branch {
      width: 6px;
      height: 30px;
      position: absolute;
      background: linear-gradient(to bottom, #fff, #ffe066);
      top: 70px;
      left: -10px;
      transform: rotate(-30deg);
      border-radius: 3px;
    }

    .bolt-branch.right {
      left: 10px;
      transform: rotate(30deg);
    }

    /* 💥 Flash overlay */
    .flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(173,216,255,0.8), rgba(255,255,255,0) 70%);
      opacity: 0;
      z-index: 10;
      pointer-events: none;
    }

    .weather-info {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #222;
      font-weight: 600;
    }

    .temperature {
      font-size: 2.5em;
      margin-bottom: 8px;
    }

    .city {
      font-size: 1.2em;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="weather-card storm">
    <div class="scene">
      <!-- ☁️ Scared Cloud -->
      <div class="rain-cloud" id="cloudFace">
        <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
          <path d="M60 90a30 30 0 1 1 10-58 40 40 0 1 1 80 10 25 25 0 1 1 5 48H60z" fill="#A6A2A2"/>
        </svg>

        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth" id="mouth"></div>
        </div>
      </div>

      <!-- 🌧️ Raindrops (more + faster) -->
      <div class="raindrop" style="left:20%;"></div>
      <div class="raindrop" style="left:30%;"></div>
      <div class="raindrop" style="left:40%;"></div>
      <div class="raindrop" style="left:50%;"></div>
      <div class="raindrop" style="left:60%;"></div>
      <div class="raindrop" style="left:70%;"></div>

      <!-- ⚡ Multiple Lightning -->
      <div class="lightning center" id="boltCenter">
        <div class="bolt-segment top"></div>
        <div class="bolt-segment bottom"></div>
        <div class="bolt-branch"></div>
        <div class="bolt-branch right"></div>
      </div>

      <div class="lightning left" id="boltLeft">
        <div class="bolt-segment top"></div>
        <div class="bolt-segment bottom"></div>
        <div class="bolt-branch"></div>
        <div class="bolt-branch right"></div>
      </div>

      <div class="lightning right" id="boltRight">
        <div class="bolt-segment top"></div>
        <div class="bolt-segment bottom"></div>
        <div class="bolt-branch"></div>
        <div class="bolt-branch right"></div>
      </div>

      <div class="flash" id="flash"></div>
    </div>

    <div class="weather-info">
      <div class="temperature">26°C</div>
      <div class="city">Chennai, India</div>
      <div>Thunderstorm ⚡🌧️</div>
    </div>
  </div>

  <script>
    const cloudFace = document.getElementById("cloudFace");
    const mouth = document.getElementById("mouth");
    const eyes = document.querySelectorAll(".eye");
    const bolts = [document.getElementById("boltCenter"), document.getElementById("boltRight"), document.getElementById("boltLeft")];
    const flash = document.getElementById("flash");

    // ☁️ Cloud trembling
    gsap.to(cloudFace, { y: "-=8", duration: 1.5, repeat: -1, yoyo: true, ease: "sine.inOut" });

    // 😨 Trembling mouth (O shape shaking)
    gsap.to(mouth, { scaleX: 0.9, scaleY: 0.4, duration: 0.7, repeat: -1, yoyo: true, ease: "sine.inOut" });

    // 👀 Eyes blink
    eyes.forEach(eye => {
      gsap.to(eye, { scaleY: 0.3, duration: 0.1, repeat: -1, yoyo: true, repeatDelay: 3 + Math.random() * 2 });
    });

    // 🌧️ Faster rain
    document.querySelectorAll(".raindrop").forEach(drop => {
      const delay = Math.random() * 1.5;
      const duration = 0.9 + Math.random() * 0.5;
      gsap.set(drop, { y: -30 - Math.random() * 40, opacity: 0.9 });
      gsap.to(drop, { y: "+=350", duration, ease: "linear", repeat: -1, delay });
    });

    // ⚡ Lightning strike sequence with screen flash
    function strikeSequence() {
      let index = 0;
      const strike = () => {
        const bolt = bolts[index];
        gsap.to(bolt, { opacity: 1, duration: 0.05 });
        gsap.to(flash, { opacity: 1, duration: 0.08, yoyo: true, repeat: 1 });
        gsap.to(bolt, { opacity: 0, delay: 0.15, duration: 0.1 });
        gsap.to(cloudFace, { x: "+=2", duration: 0.05, yoyo: true, repeat: 3 });
        index = (index + 1) % bolts.length;
        gsap.delayedCall(1, strike);
      };
      strike();
    }
    gsap.delayedCall(1, strikeSequence);
  </script>
</body>
</html>
