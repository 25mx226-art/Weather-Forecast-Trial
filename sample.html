<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>⚡ Storm Cloud – Fluffy Cartoon Thunder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: radial-gradient(circle at center, #2f3b52, #111a29);
      font-family: "Poppins", sans-serif;
      overflow: hidden;
    }

    /* ⚡ Flash overlay */
    .flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(173,216,255,0.8), rgba(0,0,50,0.1));
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      mix-blend-mode: screen;
    }

    .weather-card {
      width: 380px;
      height: 520px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      background: linear-gradient(to bottom, #6a7a91, #a6b5c7);
      position: relative;
      overflow: hidden;
      text-align: center;
      z-index: 5;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 60%;
      overflow: hidden;
    }

    /* ☁️ Fluffy Cloud Shape */
    .storm-cloud {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      width: 230px;
      height: 80px;
      background: linear-gradient(to bottom, #7d8a96, #4d5964);
      border-radius: 100px;
      z-index: 5;
      box-shadow:
        -40px 10px 0 -10px #7d8a96,
        40px 10px 0 -10px #7d8a96,
        -70px 20px 0 -20px #7d8a96,
        70px 20px 0 -20px #7d8a96;
    }

    /* 👀 Face */
    .face {
      position: absolute;
      top: 25%;
      left: 0;
      right: 0;
      text-align: center;
    }

    .eye {
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 15px;
      box-shadow: 0 0 3px #000 inset;
      overflow: hidden;
    }

    .pupil {
      width: 8px;
      height: 8px;
      background: #000;
      border-radius: 50%;
      position: absolute;
      top: 6px;
      left: 6px;
      transition: all 0.15s ease-out;
    }

    .eye.left { left: 70px; }
    .eye.right { right: 70px; }

    /* 😱 "O" scared mouth */
    .mouth {
      width: 24px;
      height: 24px;
      background: #111;
      border-radius: 50%;
      margin: 45px auto 0;
      border: 2px solid #555;
      box-shadow: 0 0 6px rgba(0,0,0,0.3) inset;
    }

    /* 🌧️ Raindrops */
    .raindrop {
      width: 6px;
      height: 16px;
      background: linear-gradient(to bottom, #aee, #48c);
      border-radius: 50%;
      position: absolute;
      bottom: 45%;
      opacity: 0.95;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
      z-index: 3;
    }

    /* ⚡ Lightning */
    .lightning {
      position: absolute;
      top: 46%;
      z-index: 4;
      opacity: 0;
      filter: drop-shadow(0 0 25px rgba(255,255,100,0.9));
      transform: scale(0.9);
    }

    .lightning.center { left: 50%; transform: translateX(-50%) scale(0.9); }
    .lightning.left { left: 25%; transform: translateX(-50%) scale(0.9); }
    .lightning.right { left: 75%; transform: translateX(-50%) scale(0.9); }

    .bolt-segment {
      position: absolute;
      background: linear-gradient(to bottom, #fff700, #ffd200);
      transform: skewX(-15deg);
    }

    .bolt-segment.top {
      width: 14px;
      height: 60px;
      left: -7px;
      top: 0;
    }

    .bolt-segment.bottom {
      width: 10px;
      height: 40px;
      left: 6px;
      top: 55px;
      transform: skewX(-15deg) rotate(10deg);
    }

    .bolt-branch {
      width: 6px;
      height: 30px;
      position: absolute;
      background: linear-gradient(to bottom, #fff, #ffe066);
      top: 70px;
      left: -10px;
      transform: rotate(-30deg);
      border-radius: 3px;
    }

    .bolt-branch.right {
      left: 10px;
      transform: rotate(30deg);
    }

    .weather-info {
      position: absolute;
      bottom: 20px;
      width: 100%;
      color: #222;
      font-weight: 600;
    }

    .temperature {
      font-size: 2.5em;
      margin-bottom: 8px;
    }

    .city {
      font-size: 1.2em;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="flash-overlay" id="flash"></div>

  <div class="weather-card storm">
    <div class="scene">
      <div class="storm-cloud" id="cloudFace">
        <div class="face">
          <div class="eye left"><div class="pupil"></div></div>
          <div class="eye right"><div class="pupil"></div></div>
          <div class="mouth" id="mouth"></div>
        </div>
      </div>

      <!-- 🌧️ Heavy Rain -->
      <div class="rain">
        <div class="raindrop" style="left:10%"></div>
        <div class="raindrop" style="left:20%"></div>
        <div class="raindrop" style="left:30%"></div>
        <div class="raindrop" style="left:40%"></div>
        <div class="raindrop" style="left:50%"></div>
        <div class="raindrop" style="left:60%"></div>
        <div class="raindrop" style="left:70%"></div>
        <div class="raindrop" style="left:80%"></div>
        <div class="raindrop" style="left:90%"></div>
      </div>

      <!-- ⚡ Lightning Bolts -->
      <div class="lightning left" id="boltLeft">
        <div class="bolt-segment top"></div>
        <div class="bolt-segment bottom"></div>
        <div class="bolt-branch"></div>
        <div class="bolt-branch right"></div>
      </div>
      <div class="lightning center" id="boltCenter">
        <div class="bolt-segment top"></div>
        <div class="bolt-segment bottom"></div>
        <div class="bolt-branch"></div>
        <div class="bolt-branch right"></div>
      </div>
      <div class="lightning right" id="boltRight">
        <div class="bolt-segment top"></div>
        <div class="bolt-segment bottom"></div>
        <div class="bolt-branch"></div>
        <div class="bolt-branch right"></div>
      </div>
    </div>

    <div class="weather-info">
      <div class="temperature">21°C</div>
      <div class="city">Chennai, India</div>
      <div>Severe Thunderstorm ⛈️</div>
    </div>
  </div>

  <script>
    const flash = document.getElementById("flash");
    const cloudFace = document.getElementById("cloudFace");
    const mouth = document.getElementById("mouth");
    const eyes = document.querySelectorAll(".eye");
    const pupils = document.querySelectorAll(".pupil");
    const bolts = [
      document.getElementById("boltCenter"),
      document.getElementById("boltRight"),
      document.getElementById("boltLeft")
    ];

    // ☁️ Floating cloud
    gsap.to(cloudFace, { y: "-=8", duration: 3, repeat: -1, yoyo: true, ease: "sine.inOut" });

    // 😱 Trembling mouth
    gsap.to(mouth, { scaleY: 1.6, scaleX: 0.8, yoyo: true, repeat: -1, duration: 0.3, ease: "elastic.inOut(1, 0.5)" });

    // 🌧️ Heavy rain
    const drops = document.querySelectorAll(".raindrop");
    drops.forEach(drop => {
      const delay = Math.random();
      const duration = 0.5 + Math.random() * 0.3;
      gsap.set(drop, { y: -40 - Math.random() * 60 });
      gsap.to(drop, { y: "+=460", duration, ease: "linear", repeat: -1, delay });
    });

    // ⚡ Lightning order (center → right → left)
    function strikeOrder() {
      const order = [bolts[0], bolts[1], bolts[2]];
      order.forEach((bolt, i) => {
        gsap.delayedCall(i, () => {
          const tl = gsap.timeline();
          tl.to(bolt, { opacity: 1, duration: 0.08 })
            .to(bolt, { opacity: 0, duration: 0.12 })
            .to(bolt, { opacity: 1, duration: 0.08 })
            .to(bolt, { opacity: 0, duration: 0.2 });

          // 🌩️ Screen flash
          gsap.fromTo(flash, { opacity: 0 }, { opacity: 1, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.inOut" });

          // 💥 Shake
          gsap.to(".weather-card", { x: "+=5", yoyo: true, repeat: 3, duration: 0.05 });
        });
      });
      gsap.delayedCall(3, strikeOrder);
    }
    strikeOrder();

    // 👀 Eye follow cursor
    document.addEventListener("mousemove", (e) => {
      const rect = cloudFace.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = (e.clientX - cx) / 50;
      const dy = (e.clientY - cy) / 50;

      pupils.forEach(p => {
        p.style.transform = `translate(${dx}px, ${dy}px)`;
      });
    });
  </script>
</body>
</html>
