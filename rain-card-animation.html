<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rain Cloud Weather Card ⛈️</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(to bottom, #87b9e1, #dbe9f4);
      font-family: "Poppins", sans-serif;
      overflow: hidden;
    }

    /* ☁️ Moving Background Clouds */
    .background-clouds {
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      background: url("https://raw.githubusercontent.com/Anish2206/cloud-bg/main/clouds.svg");
      background-repeat: repeat-x;
      background-size: contain;
      opacity: 0.5;
      animation: moveClouds 60s linear infinite;
      z-index: 0;
    }

    @keyframes moveClouds {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .weather-card {
      width: 350px;
      height: 500px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      background: linear-gradient(to bottom, #cfe4f3, #f5f9fc);
      position: relative;
      overflow: hidden;
      text-align: center;
      z-index: 2;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 60%;
      overflow: hidden;
    }

    /* ☁️ Single SVG Cloud */
    .rain-cloud {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      width: 230px;
      z-index: 3;
    }

    .rain-cloud svg {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.1));
    }

    /* 👀 Face */
    .face {
      position: absolute;
      top: 35%;
      left: 0;
      right: 0;
      text-align: center;
    }

    .eye {
      width: 14px;
      height: 14px;
      background: #333;
      border-radius: 50%;
      position: absolute;
      top: 10px;
    }

    .eye.left { left: 75px; }
    .eye.right { right: 75px; }

    .mouth {
      width: 40px;
      height: 6px;
      background: #333;
      border-radius: 50px;
      margin: 40px auto 0;
    }

    /* 🌧️ Raindrops */
    .raindrop {
      width: 6px;
      height: 14px;
      background: linear-gradient(to bottom, #aee, #48c);
      border-radius: 50%;
      position: absolute;
      bottom: 40%;
      opacity: 0.85;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.1));
      z-index: 2;
    }

    /* ⚡ Lightning bolt */
    .lightning {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      z-index: 4;
      opacity: 0;
      filter: drop-shadow(0 0 15px rgba(255,255,100,0.7));
    }

    .bolt-segment {
      position: absolute;
      background: linear-gradient(to bottom, #fff700, #ffd200);
      transform: skewX(-15deg);
    }

    .bolt-segment.top {
      width: 14px;
      height: 60px;
      left: -7px;
      top: 0;
    }

    .bolt-segment.bottom {
      width: 10px;
      height: 40px;
      left: 6px;
      top: 55px;
      transform: skewX(-15deg) rotate(10deg);
    }

    .bolt-branch {
      width: 6px;
      height: 30px;
      position: absolute;
      background: linear-gradient(to bottom, #fff, #ffe066);
      top: 70px;
      left: -10px;
      transform: rotate(-30deg);
      border-radius: 3px;
    }

    .bolt-branch.right {
      left: 10px;
      transform: rotate(30deg);
    }

    /* 🌡️ Info text */
    .weather-info {
      position: absolute;
      bottom: 20px;
      width: 100%;
      color: #222;
      font-weight: 600;
    }

    .temperature {
      font-size: 2.5em;
      margin-bottom: 8px;
    }

    .city {
      font-size: 1.2em;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <!-- ☁️ Moving background -->
  <div class="background-clouds"></div>

  <div class="weather-card rain">
    <div class="scene">
      <!-- ☁️ Single SVG Cloud -->
      <div class="rain-cloud" id="cloudFace">
        <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
          <path d="M60 90a30 30 0 1 1 10-58 40 40 0 1 1 80 10 25 25 0 1 1 5 48H60z" fill="#A6A2A2"/>
        </svg>

        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth" id="mouth"></div>
        </div>
      </div>

      <!-- 🌧️ Raindrops -->
      <div class="raindrop" style="left:25%;"></div>
      <div class="raindrop" style="left:40%;"></div>
      <div class="raindrop" style="left:55%;"></div>
      <div class="raindrop" style="left:70%;"></div>

      <!-- ⚡ Lightning -->
      <div class="lightning" id="bolt">
        <div class="bolt-segment top"></div>
        <div class="bolt-segment bottom"></div>
        <div class="bolt-branch"></div>
        <div class="bolt-branch right"></div>
      </div>
    </div>

    <div class="weather-info">
      <div class="temperature">28°C</div>
      <div class="city">Chennai, India</div>
      <div>Rainy ⛈️</div>
    </div>
  </div>

  <script>
    const cloudFace = document.getElementById("cloudFace");
    const mouth = document.getElementById("mouth");
    const eyes = document.querySelectorAll(".eye");
    const bolt = document.getElementById("bolt");

    // ☁️ Floating
    gsap.to(cloudFace, { y: "-=10", duration: 3, repeat: -1, yoyo: true, ease: "sine.inOut" });

    // 👀 Eyes blink
    eyes.forEach(eye => {
      gsap.to(eye, { scaleY: 0.3, duration: 0.12, repeat: -1, yoyo: true, repeatDelay: 3 + Math.random()*2 });
    });

    // 👀 Eyes follow cursor
    document.addEventListener("mousemove", (e) => {
      eyes.forEach(eye => {
        const rect = eye.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
        const moveX = Math.cos(angle) * 3;
        const moveY = Math.sin(angle) * 3;
        gsap.to(eye, { x: moveX, y: moveY, duration: 0.2 });
      });
    });

    // 😐 Mouth gentle pulse
    gsap.to(mouth, { scaleX: 1.2, scaleY: 1.4, duration: 2, repeat: -1, yoyo: true, ease: "sine.inOut" });

    // 🌧️ Raindrop fall
    const raindrops = document.querySelectorAll(".raindrop");
    raindrops.forEach(drop => {
      const delay = Math.random() * 2;
      const duration = 1.2 + Math.random() * 0.8;
      gsap.set(drop, { y: -20 - Math.random() * 40, opacity: 0.9 });
      gsap.to(drop, { y: "+=300", duration: duration, ease: "linear", repeat: -1, delay: delay });
    });

    // ⚡ Lightning flicker (double flash)
    function strike() {
      const shake = (Math.random() * 20 - 10);
      gsap.set(bolt, { x: shake, scale: 0.7 + Math.random() * 0.3 });
      const tl = gsap.timeline({ onComplete: () => gsap.delayedCall(5 + Math.random() * 6, strike) });
      tl.to(bolt, { opacity: 1, y: 40, duration: 0.08 })
        .to(bolt, { opacity: 0, duration: 0.1 })
        .to(bolt, { opacity: 1, duration: 0.08 })
        .to(bolt, { opacity: 0, duration: 0.15 })
        .to(cloudFace, { x: "+=2", duration: 0.05, yoyo: true, repeat: 3 });
    }
    strike();
  </script>
</body>
</html>
